---
- name: Configure EC2 Instances
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    app_user: appuser
    app_directory: /opt/app

  tasks:
    - name: Create application user
      user:
        name: "{{ app_user }}"
        system: yes
        shell: /bin/bash

    - name: Install required packages
      yum:
        name:
          - git
          - java-21-openjdk
          - maven
        state: present

    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Clone application repository
      git:
        repo: https://github.com/your-org/product-service.git
        dest: "{{ app_directory }}/product-service"
        version: main

    - name: Build application
      command: mvn clean package
      args:
        chdir: "{{ app_directory }}/product-service"
      become_user: "{{ app_user }}"

    - name: Create systemd service
      template:
        src: product-service.service.j2
        dest: /etc/systemd/system/product-service.service
      notify: restart product-service

    - name: Enable and start service
      systemd:
        name: product-service
        enabled: yes
        state: started
      notify: restart product-service

  handlers:
    - name: restart product-service
      systemd:
        name: product-service
        state: restarted